---
# =============================================================================
# 15 - Exceptions documentées (/etc/lynis/custom.prf) et finitions
# Le profil Lynis n'accepte que l'ASCII et des commentaires sur leur propre
# ligne : sinon "Fatal error: unexpected characters in profile".
# =============================================================================
- name: Exceptions | apt-listbugs EN DERNIER (DEB-0810), il épingle les paquets bogués
  ansible.builtin.apt:
    name: apt-listbugs
    state: present
    install_recommends: false
    lock_timeout: 300
  register: lynis100_listbugs_install
  failed_when: false
  when: ansible_facts.os_family == 'Debian'

- name: Exceptions | apt-listbugs réellement installé ?
  ansible.builtin.command: dpkg-query -W -f=${Status} apt-listbugs
  register: lynis100_listbugs
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == 'Debian'

- name: Exceptions | / est-il chiffré ? (DEB-0510)
  ansible.builtin.command: lsblk -no TYPE -s {{ ansible_facts.mounts | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}
  register: lynis100_root_crypt_raw
  changed_when: false
  failed_when: false

- name: Exceptions | Résultat chiffrement
  ansible.builtin.set_fact:
    lynis100_root_crypt: {rc: "{{ 0 if 'crypt' in lynis100_root_crypt_raw.stdout_lines else 1 }}"}

- name: Exceptions | /home et /var séparés ? (FILE-6310)
  ansible.builtin.command: findmnt -n {{ item }}
  loop: [/home, /var]
  register: lynis100_separate
  changed_when: false
  failed_when: false

- name: Exceptions | Liste finale
  ansible.builtin.set_fact:
    lynis100_skip_tests_final: >-
      {{ lynis100_skip_tests
         + ([{'id': 'DEB-0510', 'why': 'Disque systeme non chiffre (chiffrer = reinstaller)'}]
            if (lynis100_root_crypt.rc | int) != 0 else [])
         + ([{'id': 'DEB-0810', 'why': 'apt-listbugs absent des depots de cette distribution'}]
            if ansible_facts.os_family == 'Debian' and 'install ok installed' not in lynis100_listbugs.stdout | default('') else [])
         + ([{'id': 'FILE-6310', 'why': 'home et var sur la partition racine (repartitionner = reinstaller)'}]
            if (lynis100_exception_unpartitioned | bool)
               and (lynis100_separate.results | rejectattr('rc', 'equalto', 0) | list | length > 0) else []) }}

- name: Exceptions | Contrôle ASCII des justifications
  ansible.builtin.assert:
    that: (item.id ~ item.why) is match('^[ -~]*$')
    fail_msg: "Exception {{ item.id }} : caractères non ASCII interdits dans custom.prf."
    quiet: true
  loop: "{{ lynis100_skip_tests_final }}"
  loop_control:
    label: "{{ item.id }}"
  when: lynis100_exceptions | bool

- name: Exceptions | Dossier /etc/lynis
  ansible.builtin.file:
    path: /etc/lynis
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Exceptions | custom.prf
  ansible.builtin.template:
    src: custom.prf.j2
    dest: /etc/lynis/custom.prf
    owner: root
    group: root
    mode: "0640"
  when: lynis100_exceptions | bool

- name: Exceptions | Paquets supprimés mais non purgés (PKGS-7346)
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${db:Status-Abbrev} ${Package}\n"]
  register: lynis100_dpkg_states
  changed_when: false
  when: ansible_facts.os_family == 'Debian'

- name: Exceptions | Purge des configurations résiduelles
  ansible.builtin.apt:
    name: "{{ lynis100_dpkg_states.stdout_lines | select('match', '^rc') | map('split') | map('last') | list }}"
    state: absent
    purge: true
  when:
    - ansible_facts.os_family == 'Debian'
    - lynis100_dpkg_states.stdout_lines | select('match', '^rc') | list | length > 0
