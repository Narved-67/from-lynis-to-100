---
# =============================================================================
# 10 - DNS (NETW-2705) : résolveur local dnsmasq sur 127.0.0.1.
# Lynis ne compte pas NETW-2705 quand un résolveur local est présent, et
# dnsmasq continue de fonctionner si les DNS publics sont bloqués.
# resolv.conf = 127.0.0.1 + 1er DNS amont (DHCP ou passerelle) en secours. Persistant face au DHCP :
#   dhcpcd -> /etc/resolv.conf.head ; dhclient -> supersede domain-name-servers
# =============================================================================
- name: DNS | État de resolv.conf
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: lynis100_resolv_stat

- name: DNS | resolv.conf géré par systemd-resolved / NetworkManager
  ansible.builtin.debug:
    msg: >-
      /etc/resolv.conf est un lien vers {{ lynis100_resolv_stat.stat.lnk_source | default('?') }} :
      résolveur local déjà présent, NETW-2705 non applicable. Rien n'est modifié.
  when: lynis100_resolv_stat.stat.islnk | default(false)

- name: DNS | Configuration
  when: not (lynis100_resolv_stat.stat.islnk | default(false))
  block:
    - name: DNS | Contenu actuel de resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: lynis100_resolv_raw

    - name: DNS | Serveurs amont (questionnaire, DHCP, passerelle, puis lynis100_dns_servers)
      vars:
        lynis100_dns_single: "{{ lynis100_dns_secondary | string | lower in ['none', 'aucun', 'n', 'non'] }}"
        lynis100_dns_second: "{{ '' if lynis100_dns_single | bool else lynis100_dns_secondary }}"
        lynis100_dns_all: >-
          {{ (([lynis100_dns_primary, lynis100_dns_second] | select | list)
              + (lynis100_resolv_raw.content | b64decode | regex_findall('(?m)^\s*nameserver\s+(\S+)')
                 | reject('match', '^(127[.]|::1$)') | reject('in', lynis100_dns_servers) | list)
              + ([ansible_facts.default_ipv4.gateway | default('')] | select | list)
              + lynis100_dns_servers) | unique | list }}
      ansible.builtin.set_fact:
        # Second DNS refusé au questionnaire : un seul serveur amont, sans secours automatique
        lynis100_dns_upstream: "{{ lynis100_dns_all[:1] if lynis100_dns_single | bool else lynis100_dns_all }}"

    - name: DNS | dnsmasq
      ansible.builtin.package:
        name: "{{ lynis100_dnsmasq_pkg }}"
        state: present

    - name: DNS | dnsmasq lit /etc/dnsmasq.d (Arch ne l'active pas par défaut)
      ansible.builtin.lineinfile:
        path: /etc/dnsmasq.conf
        regexp: '^#?conf-dir=/etc/dnsmasq.d/?,\*\.conf'
        line: conf-dir=/etc/dnsmasq.d/,*.conf
      when: ansible_facts.os_family == 'Archlinux'
      notify: Redémarrer dnsmasq

    - name: DNS | Dossier /etc/dnsmasq.d
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        mode: "0755"

    - name: DNS | NetworkManager ne réécrit plus resolv.conf
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/99-lynis-to-100.conf
        content: |
          # from-lynis-to-100 (NETW-2705) : resolv.conf géré par le rôle (dnsmasq local)
          [main]
          dns=none
          rc-manager=unmanaged
        owner: root
        group: root
        mode: "0644"
      when: lynis100_networkmanager
      notify: Recharger NetworkManager

    - name: DNS | dnsmasq écoute uniquement sur 127.0.0.1
      ansible.builtin.template:
        src: dnsmasq.conf.j2
        dest: /etc/dnsmasq.d/99-lynis-to-100.conf
        owner: root
        group: root
        mode: "0644"
      notify: Redémarrer dnsmasq

    - name: DNS | Service dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        enabled: true
        state: started

    - name: DNS | Application immédiate
      ansible.builtin.meta: flush_handlers

    - name: DNS | Serveurs de resolv.conf
      ansible.builtin.set_fact:
        lynis100_dns_final: "{{ ['127.0.0.1'] + lynis100_dns_upstream[:1] }}"

    - name: DNS | resolv.conf
      ansible.builtin.template:
        src: resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        unsafe_writes: true  # resolv.conf peut être un point de montage

    - name: DNS | dhcpcd recopiera ces serveurs à chaque bail
      ansible.builtin.template:
        src: resolv.conf.j2
        dest: /etc/resolv.conf.head
        owner: root
        group: root
        mode: "0644"

    - name: DNS | dhclient présent ?
      ansible.builtin.stat:
        path: /etc/dhcp/dhclient.conf
      register: lynis100_dhclient_conf

    - name: "DNS | dhclient : serveurs imposés"
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhclient.conf
        regexp: '^(supersede|prepend) domain-name-servers '
        line: "supersede domain-name-servers {{ lynis100_dns_final | join(', ') }};"
      when: lynis100_dhclient_conf.stat.exists

    - name: DNS | Résolution via dnsmasq
      ansible.builtin.command: getent hosts deb.debian.org
      register: lynis100_dns_check
      changed_when: false
      failed_when: false

    - name: DNS | Résultat
      ansible.builtin.debug:
        msg: >-
          resolv.conf : {{ lynis100_dns_final | join(', ') }} ; amont dnsmasq : {{ lynis100_dns_upstream | join(', ') }} ;
          résolution {{ 'OK' if lynis100_dns_check.rc == 0 else 'EN ÉCHEC : vérifiez lynis100_dns_servers' }}
