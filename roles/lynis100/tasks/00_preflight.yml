---
# =============================================================================
# 00 - Préflight : tout ce qui peut empêcher le rôle de réussir est vérifié
#      AVANT la moindre modification de configuration.
# =============================================================================
- name: Préflight | Confirmation du disclaimer et du snapshot
  ansible.builtin.assert:
    that: lynis100_i_have_a_snapshot | bool
    fail_msg: >-
      Répondez « y » à la question du snapshot au lancement, ou passez
      -e lynis100_i_have_a_snapshot=true après avoir lu le README.
    quiet: true

- name: Préflight | Privilèges root (become)
  ansible.builtin.assert:
    that: ansible_facts.user_uid | int == 0
    fail_msg: "Le rôle doit s'exécuter en root : ajoutez 'become: true' au play ou -b."
    quiet: true

- name: Préflight | Famille de distribution supportée
  ansible.builtin.assert:
    that: ansible_facts.os_family in ['Debian', 'RedHat', 'Archlinux']
    fail_msg: >-
      {{ ansible_facts.distribution }} ({{ ansible_facts.os_family }}) n'est pas supporté.
      Familles supportées : Debian/Ubuntu, RedHat/Fedora/Rocky/Alma, Arch Linux.
    quiet: true

- name: Préflight | Variables propres à la distribution
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Préflight | systemd est le gestionnaire de services
  ansible.builtin.assert:
    that: ansible_facts.service_mgr == 'systemd'
    fail_msg: "systemd est requis (service_mgr={{ ansible_facts.service_mgr }})."
    quiet: true

- name: Préflight | Faits de virtualisation
  ansible.builtin.set_fact:
    lynis100_in_container: >-
      {{ ansible_facts.virtualization_role | default('') == 'guest'
         and ansible_facts.virtualization_type | default('') | lower
             in ['docker', 'podman', 'lxc', 'container', 'containerd', 'systemd-nspawn', 'openvz', 'wsl'] }}
    lynis100_virt: >-
      {{ ansible_facts.virtualization_type | default('none') | lower
         if ansible_facts.virtualization_role | default('') == 'guest' else 'none' }}

- name: Préflight | Refus en conteneur (sauf test explicite)
  ansible.builtin.assert:
    that: (not lynis100_in_container) or (lynis100_allow_container | bool)
    fail_msg: "Conteneur détecté ({{ lynis100_virt }}) : ce rôle vise une VM ou un serveur."
    quiet: true

- name: Préflight | Espace libre suffisant sur /
  ansible.builtin.assert:
    that: >-
      (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | default(10 ** 12) | int)
      >= (lynis100_min_free_mb | int) * 1048576
    fail_msg: "Moins de {{ lynis100_min_free_mb }} Mo libres sur / : libérez de l'espace."
    quiet: true

- name: Préflight | Port SSH cible valide
  ansible.builtin.assert:
    that:
      - lynis100_ssh_port | int >= 1
      - lynis100_ssh_port | int <= 65535
    fail_msg: "lynis100_ssh_port invalide : {{ lynis100_ssh_port }}"
    quiet: true

# ----------------------------------------------------------- Gestionnaire de paquets
- name: Préflight | Cache apt (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 600
    lock_timeout: 300
  register: lynis100_apt_update
  retries: 3
  delay: 10
  until: lynis100_apt_update is succeeded
  when: ansible_facts.os_family == 'Debian'

- name: Préflight | Dépôt universe actif (Ubuntu)
  ansible.builtin.command: apt-cache policy fail2ban
  register: lynis100_universe
  changed_when: false
  when: ansible_facts.distribution == 'Ubuntu'
  failed_when: "'Candidate: (none)' in lynis100_universe.stdout or lynis100_universe.stdout == ''"
  environment:
    LC_ALL: C

- name: "Préflight | Dépôts EPEL (RHEL, Rocky, Alma, CentOS : fail2ban, lynis, clamav...)"
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution != 'Fedora'
  block:
    - name: Préflight | Dépôt CRB (dépendances d'EPEL)
      community.general.dnf_config_manager:
        name: crb
        state: enabled
      failed_when: false

    - name: Préflight | epel-release
      ansible.builtin.dnf:
        name: >-
          {{ 'https://dl.fedoraproject.org/pub/epel/epel-release-latest-' ~ ansible_facts.distribution_major_version ~ '.noarch.rpm'
             if ansible_facts.distribution == 'RedHat' else 'epel-release' }}
        state: present
        disable_gpg_check: "{{ ansible_facts.distribution == 'RedHat' }}"

- name: Préflight | Synchronisation pacman (Arch)
  community.general.pacman:
    update_cache: true
  when: ansible_facts.os_family == 'Archlinux'

- name: Préflight | Outils de base nécessaires au rôle
  ansible.builtin.package:
    name: "{{ lynis100_base_tools }}"
    state: present

# ---------------------------------------------------------------------- Réseau / SSH
- name: Préflight | Ports TCP en écoute
  community.general.listen_ports_facts:
    include_non_listening: false

- name: Préflight | Ports SSH actuels et ports en écoute
  ansible.builtin.set_fact:
    lynis100_listen_ports: >-
      {{ ansible_facts.tcp_listen | rejectattr('address', 'match', '^(127[.]|::1$)')
         | map(attribute='port') | map('int') | unique | sort }}
    lynis100_current_ssh_ports: >-
      {{ (ansible_facts.tcp_listen | selectattr('name', 'equalto', 'sshd') | map(attribute='port') | map('int') | list
          + [(ansible_port | default(22)) | int]) | unique | sort }}
    lynis100_conn_port: "{{ (ansible_port | default(ansible_ssh_port) | default(22)) | int }}"
    lynis100_is_local: "{{ ansible_connection | default('ssh') == 'local' }}"

- name: Préflight | Port SSH conservé (changement refusé)
  ansible.builtin.set_fact:
    lynis100_ssh_port: "{{ lynis100_conn_port | int }}"
  when: not (lynis100_ssh_port_change | bool)

- name: Préflight | Le port SSH cible n'est pas déjà pris par un autre service
  ansible.builtin.assert:
    that: >-
      (lynis100_ssh_port | int) in lynis100_current_ssh_ports
      or (lynis100_ssh_port | int) not in lynis100_listen_ports
    fail_msg: "Le port {{ lynis100_ssh_port }} est déjà utilisé par un autre service."
    quiet: true

- name: Préflight | Comptes du système
  ansible.builtin.getent:
    database: passwd

- name: Préflight | Comptes humains (UID 1000-65533, shell valide)
  ansible.builtin.set_fact:
    lynis100_humans: "{{ lynis100_humans | default([]) + [item.key] }}"
  loop: "{{ ansible_facts.getent_passwd | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value[1] | int >= 1000
    - item.value[1] | int < 65534
    - item.value[5] is not search('(nologin|false)$')

- name: Préflight | Liste AllowUsers
  ansible.builtin.set_fact:
    lynis100_allow_users_final: >-
      {{ ((lynis100_ssh_allow_users if lynis100_ssh_allow_users | length > 0 else lynis100_humans | default([]))
          + [ansible_user | default(ansible_facts.env.SUDO_USER | default(''), true)]) | select | unique | list }}

- name: Préflight | L'utilisateur Ansible doit rester autorisé en SSH
  ansible.builtin.assert:
    that: >-
      not (lynis100_ssh_restrict_users | bool) or lynis100_is_local
      or (ansible_user | default('root')) in lynis100_allow_users_final
    fail_msg: >-
      {{ ansible_user | default('root') }} ne serait pas dans AllowUsers
      ({{ lynis100_allow_users_final | join(' ') }}) : vous perdriez l'accès.
    quiet: true

- name: Préflight | Au moins un compte autorisé en SSH
  ansible.builtin.assert:
    that: not (lynis100_ssh_restrict_users | bool) or lynis100_allow_users_final | length > 0
    fail_msg: "Aucun compte à autoriser en SSH : définissez lynis100_ssh_allow_users."
    quiet: true

- name: Préflight | Mot de passe GRUB fourni si la protection est demandée
  ansible.builtin.assert:
    that: >-
      not (lynis100_grub_protect | bool) or lynis100_in_container
      or (lynis100_grub_password_pbkdf2 | length > 0)
      or (lynis100_grub_password | length > 0)
    fail_msg: >-
      Protection GRUB demandée sans mot de passe : répondez à la question GRUB,
      ou définissez lynis100_grub_password (ansible-vault) / lynis100_grub_password_pbkdf2.
    quiet: true

# ---------------------------------------------------------------- Environnement
- name: Préflight | Outils présents (Docker, snap, ufw, firewalld, NetworkManager)
  ansible.builtin.service_facts:

- name: Préflight | Binaires présents
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/usr/bin/docker, /usr/bin/snap, /usr/sbin/ufw]
  register: lynis100_bins

- name: Préflight | Routage IP actif ?
  ansible.builtin.slurp:
    src: /proc/sys/net/ipv4/ip_forward
  register: lynis100_ipfwd

- name: Préflight | SELinux actif ?
  ansible.builtin.set_fact:
    lynis100_selinux: "{{ ansible_facts.selinux.status | default('disabled') == 'enabled' }}"

- name: Préflight | Faits d'environnement
  ansible.builtin.set_fact:
    lynis100_has_docker: "{{ lynis100_bins.results[0].stat.exists }}"
    lynis100_forwarding_needed: "{{ lynis100_bins.results[0].stat.exists or (lynis100_ipfwd.content | b64decode | trim) == '1' }}"
    lynis100_has_snap: "{{ lynis100_bins.results[1].stat.exists }}"
    lynis100_use_ufw: "{{ lynis100_bins.results[2].stat.exists and ansible_facts.services['ufw.service'].state | default('') == 'running' }}"
    lynis100_use_firewalld: "{{ ansible_facts.services['firewalld.service'].state | default('') == 'running' }}"
    lynis100_networkmanager: "{{ ansible_facts.services['NetworkManager.service'].state | default('') == 'running' }}"
    lynis100_usb_allowed: >-
      {{ (lynis100_disable_usb | bool) and not lynis100_in_container
         and ((lynis100_virt != 'none') or (lynis100_disable_usb_on_bare_metal | bool)) }}

- name: Préflight | Épinglages apt-listbugs présents ?
  ansible.builtin.stat:
    path: /etc/apt/preferences.d/apt-listbugs
  register: lynis100_listbugs_pin

- name: Préflight | Dossiers de configuration utilisés par le rôle
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/modprobe.d
    - /etc/sysctl.d
    - /etc/security/limits.d
    - /etc/profile.d
    - /etc/ssh/sshd_config.d
    - /etc/systemd/coredump.conf.d

- name: Préflight | Dossier de sauvegarde
  ansible.builtin.file:
    path: "{{ lynis100_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Préflight | Archive des fichiers qui vont être modifiés
  community.general.archive:
    path: "{{ lynis100_backup_paths }}"
    dest: "{{ lynis100_backup_dir }}/{{ ansible_facts.date_time.iso8601_basic_short }}.tar.gz"
    format: gz
    mode: "0600"
  vars:
    lynis100_backup_paths:
      - /etc/login.defs
      - /etc/fstab
      - /etc/ssh
      - /etc/security/limits.conf
      - /etc/systemd/coredump.conf
      - /etc/fail2ban
      - /etc/nftables.conf
      - /etc/sysconfig/nftables.conf
      - /etc/usbguard
      - /etc/resolv.conf
      - /etc/resolv.conf.head
      - /etc/dhcp/dhclient.conf
      - /etc/NetworkManager/conf.d
      - /etc/default/sysstat
      - /etc/default/debsums
      - /etc/aide/aide.conf
      - /etc/aide.conf
      - /etc/issue
      - /etc/issue.net
      - /etc/grub.d/40_custom
      - /etc/grub.d/10_linux
      - /boot/grub2/user.cfg
      - /etc/nginx
      - /etc/lynis
      - /etc/apt/preferences.d
      - /etc/dnf/automatic.conf

- name: Préflight | Récapitulatif
  ansible.builtin.debug:
    msg:
      - "Système      : {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} ({{ ansible_facts.os_family }}, {{ lynis100_virt }})"
      - "SSH          : port {{ lynis100_current_ssh_ports | join(',') }} -> {{ lynis100_ssh_port }}"
      - "AllowUsers   : {{ lynis100_allow_users_final | join(' ') if lynis100_ssh_restrict_users | bool else 'non modifié' }}"
      - >-
        Pare-feu     : {{ 'non modifié' if not lynis100_firewall | bool
        else ('firewalld' if lynis100_use_firewalld else ('ufw' if lynis100_use_ufw else 'nftables')) }}
      - "USB          : {{ 'désactivé' if lynis100_usb_allowed else 'non modifié' }}"
      - "SELinux      : {{ 'actif (port SSH déclaré à SELinux)' if lynis100_selinux else 'inactif' }}"
      - "Sauvegarde   : {{ lynis100_backup_dir }}/{{ ansible_facts.date_time.iso8601_basic_short }}.tar.gz"
