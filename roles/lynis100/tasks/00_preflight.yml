---
# =============================================================================
# 00 - Préflight : tout ce qui peut empêcher le rôle de réussir est vérifié
#      AVANT la moindre modification.
# =============================================================================
- name: Préflight | Le disclaimer a été lu et un snapshot existe
  ansible.builtin.assert:
    that: lynis100_i_have_a_snapshot | bool
    fail_msg: >-
      Lisez le disclaimer du README, faites un snapshot/une sauvegarde, puis
      relancez avec -e lynis100_i_have_a_snapshot=true
    quiet: true

- name: Préflight | Privilèges root (become)
  ansible.builtin.assert:
    that: ansible_facts.user_uid | int == 0
    fail_msg: "Le rôle doit s'exécuter en root : ajoutez 'become: true' au play ou -b."
    quiet: true

- name: Préflight | Distribution supportée
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - >-
        (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version in ['12', '13'])
        or (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version in ['22.04', '24.04'])
    fail_msg: >-
      Système non supporté : {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
      Supportés : Debian 12/13, Ubuntu 22.04/24.04.
    quiet: true

- name: Préflight | systemd est le gestionnaire de services
  ansible.builtin.assert:
    that: ansible_facts.service_mgr == 'systemd'
    fail_msg: "systemd est requis (service_mgr={{ ansible_facts.service_mgr }})."
    quiet: true

- name: Préflight | Détection conteneur
  ansible.builtin.command: systemd-detect-virt --container
  register: lynis100_ctr
  changed_when: false
  failed_when: false

- name: Préflight | Détection machine virtuelle
  ansible.builtin.command: systemd-detect-virt --vm
  register: lynis100_vm
  changed_when: false
  failed_when: false

- name: Préflight | Faits de virtualisation
  ansible.builtin.set_fact:
    lynis100_in_container: "{{ lynis100_ctr.rc == 0 }}"
    lynis100_virt: >-
      {{ (lynis100_ctr.stdout | trim) if lynis100_ctr.rc == 0
         else (lynis100_vm.stdout | default('none', true) | trim) }}

- name: Préflight | Refus en conteneur (sauf test explicite)
  ansible.builtin.assert:
    that: (not lynis100_in_container) or (lynis100_allow_container | bool)
    fail_msg: "Conteneur détecté ({{ lynis100_virt }}) : ce rôle vise une VM ou un serveur."
    quiet: true

- name: Préflight | Espace disque libre sur /
  ansible.builtin.command: df --output=avail -BM /
  register: lynis100_df
  changed_when: false

- name: Préflight | Espace libre suffisant sur /
  ansible.builtin.assert:
    that: (lynis100_df.stdout_lines[-1] | regex_replace('[^0-9]', '') | int) >= (lynis100_min_free_mb | int)
    fail_msg: "Seulement {{ lynis100_df.stdout_lines[-1] | trim }} libres sur / : il faut {{ lynis100_min_free_mb }} Mo."
    quiet: true

- name: Préflight | Port SSH cible valide
  ansible.builtin.assert:
    that:
      - lynis100_ssh_port | int >= 1
      - lynis100_ssh_port | int <= 65535
    fail_msg: "lynis100_ssh_port invalide : {{ lynis100_ssh_port }}"
    quiet: true

- name: Préflight | Ports TCP en écoute
  ansible.builtin.command: ss -Htlnp
  register: lynis100_ss
  changed_when: false

- name: Préflight | Ports SSH actuels et ports en écoute
  ansible.builtin.set_fact:
    lynis100_listen_ports: >-
      {{ lynis100_ss.stdout_lines
         | map('split') | map(attribute=3)
         | reject('match', '^(127\.|\[::1\]|::1)')
         | map('regex_replace', '^.*:', '') | select('match', '^[0-9]+$')
         | map('int') | unique | sort }}
    lynis100_current_ssh_ports: >-
      {{ lynis100_ss.stdout_lines | select('search', '"sshd"')
         | map('split') | map(attribute=3) | map('regex_replace', '^.*:', '')
         | select('match', '^[0-9]+$') | map('int') | unique | sort }}
    lynis100_conn_port: "{{ (ansible_port | default(ansible_ssh_port) | default(22)) | int }}"
    lynis100_is_local: "{{ ansible_connection | default('ssh') == 'local' }}"

- name: Préflight | Le port SSH cible n'est pas déjà pris par un autre service
  ansible.builtin.assert:
    that: >-
      (lynis100_ssh_port | int) in lynis100_current_ssh_ports
      or (lynis100_ssh_port | int) not in lynis100_listen_ports
    fail_msg: "Le port {{ lynis100_ssh_port }} est déjà utilisé par un autre service."
    quiet: true

- name: Préflight | Comptes humains (AllowUsers automatique)
  ansible.builtin.getent:
    database: passwd

- name: Préflight | Comptes humains (UID 1000-65533, shell valide)
  ansible.builtin.set_fact:
    lynis100_humans: "{{ lynis100_humans | default([]) + [item.key] }}"
  loop: "{{ ansible_facts.getent_passwd | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value[1] | int >= 1000
    - item.value[1] | int < 65534
    - item.value[5] is not search('(nologin|false)$')

- name: Préflight | Liste AllowUsers
  ansible.builtin.set_fact:
    lynis100_allow_users_final: >-
      {{ ((lynis100_ssh_allow_users if lynis100_ssh_allow_users | length > 0 else lynis100_humans | default([]))
          + [ansible_user | default(ansible_env.SUDO_USER | default(''), true)]) | select | unique | list }}

- name: Préflight | L'utilisateur Ansible doit rester autorisé en SSH
  ansible.builtin.assert:
    that: >-
      lynis100_is_local
      or (ansible_user | default('root')) in lynis100_allow_users_final
    fail_msg: >-
      {{ ansible_user | default('root') }} ne serait pas dans AllowUsers
      ({{ lynis100_allow_users_final | join(' ') }}) : vous perdriez l'accès.
    quiet: true

- name: Préflight | Au moins un compte autorisé en SSH
  ansible.builtin.assert:
    that: lynis100_allow_users_final | length > 0
    fail_msg: "Aucun compte à autoriser en SSH : définissez lynis100_ssh_allow_users."
    quiet: true

- name: Préflight | Mot de passe GRUB fourni si la protection est demandée
  ansible.builtin.assert:
    that: >-
      not (lynis100_grub_protect | bool) or lynis100_in_container
      or (lynis100_grub_password_pbkdf2 | length > 0)
      or (lynis100_grub_password | length > 0)
    fail_msg: >-
      lynis100_grub_protect=true mais aucun mot de passe : définissez
      lynis100_grub_password (ansible-vault) ou lynis100_grub_password_pbkdf2,
      ou passez lynis100_grub_protect=false.
    quiet: true

- name: Préflight | Docker présent ? (forwarding et pare-feu)
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: lynis100_docker

- name: Préflight | snapd présent ? (squashfs)
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: lynis100_snap

- name: Préflight | ufw présent ?
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: lynis100_ufw_bin

- name: Préflight | Routage IP actif ?
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: lynis100_ipfwd
  changed_when: false
  failed_when: false

- name: Préflight | Faits d'environnement
  ansible.builtin.set_fact:
    lynis100_forwarding_needed: "{{ lynis100_docker.stat.exists or (lynis100_ipfwd.stdout | default('0') | trim) == '1' }}"
    lynis100_has_snap: "{{ lynis100_snap.stat.exists }}"
    lynis100_use_ufw: "{{ lynis100_ufw_bin.stat.exists }}"
    lynis100_usb_allowed: >-
      {{ (lynis100_disable_usb | bool) and not lynis100_in_container
         and ((lynis100_virt != 'none') or (lynis100_disable_usb_on_bare_metal | bool)) }}

- name: Préflight | Attente du verrou dpkg et mise à jour du cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 600
    lock_timeout: 300
  register: lynis100_apt_update
  retries: 3
  delay: 10
  until: lynis100_apt_update is succeeded

- name: Préflight | Dépôt universe actif (Ubuntu)
  ansible.builtin.command: apt-cache policy fail2ban
  register: lynis100_universe
  changed_when: false
  when: ansible_facts.distribution == 'Ubuntu'
  failed_when: "'Candidate: (none)' in lynis100_universe.stdout or lynis100_universe.stdout == ''"
  environment:
    LC_ALL: C

- name: Préflight | Épinglages apt-listbugs présents ?
  ansible.builtin.stat:
    path: /etc/apt/preferences.d/apt-listbugs
  register: lynis100_listbugs_pin

- name: Préflight | Outils de base nécessaires au rôle
  ansible.builtin.apt:
    name:
      - iproute2        # ss
      - util-linux      # findmnt, mount
      - procps          # sysctl
      - openssl
      - grub-common     # grub-mkpasswd-pbkdf2
      - openssh-server  # sshd -t
      - lsb-release
      - python3-apt
    state: present
    lock_timeout: 300

- name: Préflight | Dossiers de configuration utilisés par le rôle
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/modprobe.d
    - /etc/sysctl.d
    - /etc/security/limits.d
    - /etc/profile.d
    - /etc/apt/apt.conf.d
    - /etc/ssh/sshd_config.d
    - /etc/systemd/coredump.conf.d

- name: Préflight | Dossier de sauvegarde
  ansible.builtin.file:
    path: "{{ lynis100_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Préflight | Archive des fichiers qui vont être modifiés
  ansible.builtin.shell:
    cmd: |
      files=()
      for f in {{ lynis100_backup_paths | join(' ') }}; do [ -e "$f" ] && files+=("$f"); done
      tar -czf {{ lynis100_backup_dir }}/{{ ansible_date_time.iso8601_basic_short }}.tar.gz "${files[@]}"
    executable: /bin/bash
    creates: "{{ lynis100_backup_dir }}/{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
  vars:
    lynis100_backup_paths:
      - /etc/login.defs
      - /etc/fstab
      - /etc/ssh
      - /etc/security/limits.conf
      - /etc/systemd/coredump.conf
      - /etc/fail2ban
      - /etc/nftables.conf
      - /etc/usbguard
      - /etc/resolv.conf
      - /etc/dhcp/dhclient.conf
      - /etc/dhcpcd.conf
      - /etc/default/sysstat
      - /etc/default/debsums
      - /etc/aide/aide.conf
      - /etc/issue
      - /etc/issue.net
      - /etc/grub.d/40_custom
      - /etc/grub.d/10_linux
      - /etc/nginx
      - /etc/lynis
      - /etc/apt/preferences.d
  register: lynis100_backup
  failed_when: lynis100_backup.rc | default(0) not in [0, 1]

- name: Préflight | Récapitulatif
  ansible.builtin.debug:
    msg:
      - "Système      : {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} ({{ lynis100_virt }})"
      - "SSH          : port {{ lynis100_current_ssh_ports | join(',') | default('?', true) }} -> {{ lynis100_ssh_port }}"
      - "AllowUsers   : {{ lynis100_allow_users_final | join(' ') }}"
      - "Pare-feu     : {{ 'ufw' if lynis100_use_ufw else 'nftables' }} {{ '(ignoré : Docker)' if lynis100_docker.stat.exists else '' }}"
      - "USB          : {{ 'désactivé' if lynis100_usb_allowed else 'non modifié' }}"
      - "Sauvegarde   : {{ lynis100_backup_dir }}/{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
