---
# =============================================================================
# 02 - Paquets de sécurité (liste propre à chaque famille : vars/<famille>.yml)
# DEB-0280 DEB-0811 DEB-0831 DEB-0880 AUTH-9262 PKGS-7370 PKGS-7394 PKGS-7420
# ACCT-9622 ACCT-9626 ACCT-9628 FINT-4350 HRDN-7230 USB-3000
# Sur Debian, apt-listbugs est installé à la toute fin (15_exceptions.yml) :
# il épingle les paquets bogués et bloquerait ces installations.
# =============================================================================
- name: Paquets | Disponibilité dans les dépôts apt (Debian/Ubuntu)
  ansible.builtin.command: apt-cache policy {{ item }}
  loop: "{{ lynis100_security_packages }}"
  register: lynis100_pkg_policy
  changed_when: false
  environment:
    LC_ALL: C
  when: ansible_facts.os_family == 'Debian'

- name: Paquets | Installation en une fois, sans Recommends (Debian/Ubuntu)
  ansible.builtin.apt:
    name: >-
      {{ lynis100_pkg_policy.results | rejectattr('stdout', 'search', 'Candidate: [(]none[)]')
         | rejectattr('stdout', 'equalto', '') | map(attribute='item') | list }}
    state: present
    install_recommends: false
    lock_timeout: 300
  register: lynis100_pkg_install_deb
  when: ansible_facts.os_family == 'Debian'

- name: "Paquets | Installation un par un (RedHat, Arch : un paquet absent n'empêche pas les autres)"
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ lynis100_security_packages }}"
  register: lynis100_pkg_install_other
  failed_when: false
  when: ansible_facts.os_family != 'Debian'

- name: Paquets | Bilan
  ansible.builtin.set_fact:
    lynis100_pkg_install: "{{ lynis100_pkg_install_deb if ansible_facts.os_family == 'Debian' else lynis100_pkg_install_other }}"
    lynis100_pkgs_missing: >-
      {{ (lynis100_pkg_policy.results | default([]) | selectattr('stdout', 'defined')
          | selectattr('stdout', 'search', 'Candidate: [(]none[)]') | map(attribute='item') | list)
         if ansible_facts.os_family == 'Debian'
         else (lynis100_pkg_install_other.results | default([]) | selectattr('failed', 'defined')
               | selectattr('failed') | map(attribute='item') | list) }}

- name: Paquets | Tous les paquets de sécurité sont installés (arrêt sinon)
  ansible.builtin.assert:
    that: lynis100_pkgs_missing | length == 0 or (lynis100_allow_missing_packages | bool)
    fail_msg: >-
      Paquets non installés : {{ lynis100_pkgs_missing | join(', ') }}.
      Arrêt avant toute modification de configuration. Vérifiez les dépôts
      (EPEL, universe...) ou relancez avec -e lynis100_allow_missing_packages=true
      (les tests Lynis correspondants perdront des points).
    success_msg: "Paquets de sécurité installés : {{ lynis100_security_packages | join(', ') }}"

- name: Paquets | Paquets manquants acceptés
  ansible.builtin.debug:
    msg: "Non installés (points Lynis perdus) : {{ lynis100_pkgs_missing | join(', ') }}"
  when: lynis100_pkgs_missing | length > 0

- name: Paquets | Mise à jour de sécurité du système (PKGS-7392)
  ansible.builtin.package:
    name: "*"
    state: latest  # noqa: package-latest
  when:
    - lynis100_upgrade_packages | bool
    - ansible_facts.os_family != 'Debian'

- name: Paquets | Mise à jour de sécurité (Debian/Ubuntu)
  ansible.builtin.apt:
    upgrade: safe
    lock_timeout: 300
  when:
    - lynis100_upgrade_packages | bool
    - ansible_facts.os_family == 'Debian'
