---
# =============================================================================
# 07 - SSH (sans changement de port : voir 16_ssh_port_switch.yml) et fail2ban
# SSH-7408 SSH-7440 DEB-0880 TOOL-5104
# =============================================================================
- name: SSH | Dossier de séparation de privilèges (absent tant que ssh.socket n'a pas lancé sshd)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: SSH | sshd_config inclut sshd_config.d
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s

- name: SSH | Durcissement (drop-in) avec contrôle et retour arrière
  block:
    - name: SSH | Drop-in de durcissement
      ansible.builtin.template:
        src: sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/99-lynis-to-100.conf
        owner: root
        group: root
        mode: "0600"
      notify: Recharger sshd

    - name: SSH | Validation de la configuration complète
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: SSH | Rechargement de sshd si modifié (les sessions ouvertes sont conservées)
      ansible.builtin.meta: flush_handlers

  rescue:
    - name: "SSH | Configuration invalide : suppression du drop-in"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-lynis-to-100.conf
        state: absent

    - name: SSH | Arrêt
      ansible.builtin.fail:
        msg: "La configuration SSH générée est invalide (sshd -t) : elle a été retirée, rien n'est appliqué."

- name: SSH | Droits de sshd_config
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"

- name: fail2ban | jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer fail2ban

- name: fail2ban | Service actif
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
