---
- name: Recharger sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Recharger nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true
  notify: Redémarrer fail2ban

- name: Redémarrer fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Redémarrer usbguard
  ansible.builtin.systemd:
    name: usbguard
    state: restarted

- name: Recharger auditd
  ansible.builtin.command: augenrules --load
  changed_when: true
  failed_when: false  # auditd indisponible en conteneur : signalé en 11_audit_integrity

- name: Recharger nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Mettre à jour GRUB
  ansible.builtin.command: update-grub
  changed_when: true

- name: Recharger postfix
  ansible.builtin.systemd:
    name: postfix
    state: reloaded
