---
- name: Recharger sshd
  ansible.builtin.systemd:
    name: "{{ lynis100_ssh_service }}"
    state: reloaded

- name: Recharger nftables
  ansible.builtin.command: nft -f {{ lynis100_nft_conf }}
  changed_when: true
  notify: Redémarrer fail2ban

- name: Redémarrer fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Redémarrer usbguard
  ansible.builtin.systemd:
    name: usbguard
    state: restarted

- name: Recharger auditd
  ansible.builtin.command: augenrules --load
  changed_when: true
  failed_when: false  # auditd indisponible en conteneur : signalé en 11_audit_integrity

- name: Recharger nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Mettre à jour GRUB
  ansible.builtin.command:
    argv: "{{ lynis100_grub_update_cmd }}"
  changed_when: true
  when: lynis100_grub_update_cmd | length > 0

- name: Recharger postfix
  ansible.builtin.systemd:
    name: postfix
    state: reloaded

- name: Redémarrer dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted

- name: Recharger NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
